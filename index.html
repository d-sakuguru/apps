<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D'Saku Guru</title>
  <link rel="icon" href="https://i.ibb.co.com/vCd6bGZX/logo.png" />
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0f1020;
      font-family: 'Quicksand', sans-serif, system-ui;
      overflow: hidden;
    }
    
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }

    .logo-container {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .glow-effect {
      position: absolute;
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #3b82f6, #ec4899);
      border-radius: 50%;
      filter: blur(25px);
      opacity: 0.5;
      animation: pulseGlow 2s infinite alternate;
    }

    .app-logo {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .app-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      text-align: center;
      padding: 0 20px;
    }

    .app-subtitle {
      color: #94a3b8;
      font-size: 10px; /* Ukuran teks diperkecil */
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: none; /* Dibuat normal agar kalimat doa/ucapan lebih nyaman dibaca */
      margin: 0 0 24px 0;
      text-align: center;
      padding: 0 20px;
    }

    .loading-bar {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, #3b82f6, #ec4899, transparent);
      animation: loadingSlide 1.5s infinite linear;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.4; }
      100% { transform: scale(1.15); opacity: 0.7; }
    }

    @keyframes loadingSlide {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <!-- Splash Screen dengan Sapaan & Label Kondisional Berdasarkan Waktu -->
  <div id="loader">
    <div class="logo-container">
      <div class="glow-effect"></div>
      <img src="https://i.ibb.co.com/vCd6bGZX/logo.png" alt="Logo" class="app-logo" />
    </div>
    <h1 class="app-title" id="greeting-text">Memuat...</h1>
    <p class="app-subtitle" id="subtitle-text">Menyiapkan Ruang Kerja...</p>
    <div class="loading-bar"></div>
  </div>

  <iframe
    id="app"
    allowfullscreen="true"
    allow="fullscreen; camera; microphone; display-capture; geolocation;"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals">
  </iframe>

  <script>
    // --- SKRIP OTOMATIS MENENTUKAN UCAPAN & PESAN BERDASARKAN WAKTU ---
    const hours = new Date().getHours();
    let greeting = "Selamat Malam";
    let subMessage = "Semoga Doa dan Harapan menemukan jalannya";
    
    if (hours >= 4 && hours < 11) {
      greeting = "Selamat Pagi";
      subMessage = "Bissmillah, Semoga hari ini penuh berkah";
    } else if (hours >= 11 && hours < 15) {
      greeting = "Selamat Siang";
      subMessage = "Semoga langkah hari ini selalu dimudahkan";
    } else if (hours >= 15 && hours < 18) {
      greeting = "Selamat Sore";
      subMessage = "Semoga lelah hari ini menjadi berkah";
    }

    document.getElementById('greeting-text').innerText = greeting;
    document.getElementById('subtitle-text').innerText = subMessage;

    // --- INISIALISASI APLIKASI ---
    const primaryUrl = "https://script.google.com/macros/s/AKfycbyP1STVvtdQTOMFrBBhvkZbFzoDLmopwylc3ysKE7Cqrf2QL22kKldCjqUIgOh8zNya0g/exec";
    const workspaceUrl = "https://script.google.com/a/~/macros/s/AKfycbyP1STVvtdQTOMFrBBhvkZbFzoDLmopwylc3ysKE7Cqrf2QL22kKldCjqUIgOh8zNya0g/exec";

    const iframe = document.getElementById('app');
    const loader = document.getElementById('loader');

    const useAlternative = localStorage.getItem('d_saku_use_alt');
    iframe.src = useAlternative === 'true' ? workspaceUrl : primaryUrl;

    // Timer loader pembuka
    window.addEventListener('load', () => {
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 600);
      }, 7500); 
    });
  </script>
</body>
</html>
