<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D'Saku Guru</title>
  <link rel="icon" href="https://i.ibb.co.com/vCd6bGZX/logo.png" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f1020;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif, system-ui;
    }

    /* Teks / Indikator loading sederhana di latar belakang */
    #bg-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      z-index: 1;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      z-index: 2;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <!-- Tulisan pemuat sementara sebelum iframe tampil -->
  <div id="bg-loader">Menyiapkan Aplikasi...</div>

  <div class="iframe-container">
    <iframe
      id="app"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals">
    </iframe>
  </div>

  <script>
    const primaryUrl = "https://script.google.com/macros/s/AKfycbyP1STVvtdQTOMFrBBhvkZbFzoDLmopwylc3ysKE7Cqrf2QL22kKldCjqUIgOh8zNya0g/exec";
    const workspaceUrl = "https://script.google.com/a/~/macros/s/AKfycbyP1STVvtdQTOMFrBBhvkZbFzoDLmopwylc3ysKE7Cqrf2QL22kKldCjqUIgOh8zNya0g/exec";

    const iframe = document.getElementById('app');
    const bgLoader = document.getElementById('bg-loader');
    const useAlternative = localStorage.getItem('d_saku_use_alt');

    // Sembunyikan teks loader setelah iframe selesai dimuat
    iframe.onload = function() {
      bgLoader.style.display = 'none';
    };

    iframe.src = useAlternative === 'true' ? workspaceUrl : primaryUrl;
  </script>
</body>
</html>
