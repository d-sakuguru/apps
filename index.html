<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D-SAKU GURU</title>
  <!-- CSS Langsung di HEAD untuk menghindari kedipan putih -->
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #1e1b4b; /* WARNA GELAP SENADA DENGAN LOGIN */
    }
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #1e1b4b; display: flex; align-items: center; justify-content: center;
      color: white; font-family: sans-serif; z-index: 9999;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Loader instan -->
  <div id="loader">Memuat D'Saku Guru...</div>

  <iframe
    id="app"
    allowfullscreen="true"
    allow="fullscreen; camera; microphone; display-capture; geolocation;"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals">
  </iframe>

  <script>
    const primaryUrl = "https://script.google.com/macros/s/AKfycbyP1STVvtdQTOMFrBBhvkZbFzoDLmopwylc3ysKE7Cqrf2QL22kKldCjqUIgOh8zNya0g/exec";
    const workspaceUrl = "https://script.google.com/a/~/macros/s/AKfycbyP1STVvtdQTOMFrBBhvkZbFzoDLmopwylc3ysKE7Cqrf2QL22kKldCjqUIgOh8zNya0g/exec";

    const iframe = document.getElementById('app');
    const loader = document.getElementById('loader');

    // Sembunyikan loader setelah iframe benar-benar termuat
    iframe.onload = function() {
      loader.style.display = 'none';
    };

    iframe.src = localStorage.getItem('d_saku_use_alt') === 'true' ? workspaceUrl : primaryUrl;
  </script>
</body>
</html>
